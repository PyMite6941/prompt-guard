name: Publish to npm

# Auto-publishes whenever master carries a package.json version that is not
# yet on npm. To release: bump "version" (e.g. `npm version patch`), push to
# master. The workflow publishes, then creates the vX.Y.Z tag + GitHub Release.
# Pushes that don't change the version are a no-op.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write # push the release tag + create the GitHub Release
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # ships npm 11, required for trusted publishing
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Check whether this version is already on npm
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is not on npm yet; publishing."
          fi

      - name: Install dependencies
        if: steps.check.outputs.published != 'true'
        run: npm ci

      - name: Build
        if: steps.check.outputs.published != 'true'
        run: npm run build

      - name: Run tests
        if: steps.check.outputs.published != 'true'
        run: npm test

      # Authenticates via OIDC — this repo + publish.yml must be registered as
      # a Trusted Publisher on npmjs.com. No NPM_TOKEN / OTP needed.
      - name: Publish to npm
        if: steps.check.outputs.published != 'true'
        run: npm publish --access public --provenance

      - name: Create tag and GitHub Release
        if: steps.check.outputs.published != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
