name: Scan prompts with Prompt Guard

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  # Required for SARIF upload to GitHub code scanning.
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Scan source modules with Prompt Guard (SARIF)
        run: node dist/cli.js src --sarif --ignore=socialHandle --exclude=patterns.ts > prompt-guard.sarif || true

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: prompt-guard.sarif

      - name: Scan clean fixture (must pass)
        run: node dist/cli.js examples/clean.txt

      - name: Scan unsafe fixture (must be caught)
        run: |
          if node dist/cli.js examples/leak.txt; then
            echo "ERROR: leak.txt was not flagged — detection regressed" >&2
            exit 1
          fi
